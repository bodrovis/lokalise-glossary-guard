name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false

    - name: Ensure release does not exist
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        if gh release view "$GITHUB_REF_NAME" \
          --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "::error::Release $GITHUB_REF_NAME already exists"
          exit 1
        fi
        
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        check-latest: false
        cache: false
        
    - name: Check Go modules
      run: |
        set -euo pipefail
        go mod tidy
        git diff --exit-code -- go.mod go.sum
        go mod verify

    - name: Run tests
      run: go test -shuffle=on -count=1 -race ./... -v -coverprofile=coverage.out

    - uses: qltysh/qlty-action/coverage@ebcd284bf32e36a030afe15f1e136c7be08b9506
      with:
        token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
        files: coverage.out
        strip-prefix: github.com/bodrovis/lokalise-glossary-guard/

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24

    - name: Run WASM tests
      run: |
        GOOS=js GOARCH=wasm go test \
          -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" \
          -shuffle=on \
          -count=1 \
          ./wasm