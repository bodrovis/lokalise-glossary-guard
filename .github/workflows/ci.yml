name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6.0.2
      with:
        persist-credentials: false
        
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'
        cache: false
        
    - name: Run tests
      run: go test -shuffle=on -count=1 -race ./... -v -coverprofile=coverage.out

    - uses: qltysh/qlty-action/coverage@v2.2.0
      with:
        token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
        files: coverage.out
        strip-prefix: github.com/bodrovis/lokalise-glossary-guard/

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: 22

    - name: Run WASM tests
      run: |
        GOOS=js GOARCH=wasm go test \
          -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" \
          -shuffle=on \
          -count=1 \
          ./wasm